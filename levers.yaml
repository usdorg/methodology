aggregation:
  prior:
    percentile: 0.4
    cap: 0.5
  confidence:
    base: 0.7
    families_bonus: 0.3
    families_full: 4
  listed_if:
    min_ok_levers: 5
    min_confidence: 0.4
  top_eligible:
    min_confidence: 0.6
    min_clean_record: 0.6
    claims_match: 1.0
    registry_levers:
    - L1
    - L3
    - L4
    - L12
    min_registry_levers_ok: 3
  discrimination:
    shown: 12
    min_iqr: 8
    close_gap: 1
    max_close_share: 0.3
    max_top3_interval: 3
    max_p80_rank: 10
    top_n: 10
    bootstrap: 500
    dirichlet_concentration: 30
functions:
  log_cap:
    formula: min(1, ln(1 + x) / ln(1 + cap))
    meaning: 'Diminishing returns: each extra unit adds less, and the value reaches 1 at x = cap.'
  penalty:
    formula: exp(-sum(severity * exp(-age_years / tau)) / scale)
    scale: 50.0
    tau: 3.0
    max_age_years: 7.0
    age_if_unknown: 1.0
    meaning: No events gives 1. Each event lowers the value by its severity (0 to 100) and fades with age; events older than
      max_age_years are not counted.
  wilson_lb:
    formula: lower bound of the Wilson score interval for k successes out of n
    z: 1.64
    n_min: 10
    meaning: A share that cannot be inflated by a few answers; below n_min it is not scored.
  rel:
    formula: with the feature 0.5 + 0.5 * (1 - p), without it 0.5 - 0.5 * p
    meaning: A feature counts more when it is rare in the trade (p = share of companies that have it).
  warranty:
    formula: 0.95 * log_cap(months, 24); lifetime with stated conditions 1.0, without conditions 0.95; no stated length counts
      as 1 month; parts only x 0.5
    meaning: Value of a written workmanship warranty.
  tier:
    formula: value from the table
    meaning: Fixed steps, for example license class.
  value:
    formula: the input as is (0 to 1)
    meaning: Yes or no, or strength of evidence.
  dev:
    formula: 'price / city median: 0.7 to 1.3 gives 1, above 1.3 falls to 0 at 2.2, 0.5 to 0.7 rises from 0.75 to 1, below
      0.5 gives 0.5'
    meaning: Fairness of a price against the city median.
evidence:
- level: Public record
  example: License found in the state register
  strength: 1.0
- level: Document on the website
  example: Certificate of insurance published as a file
  strength: 0.8
- level: Specific claim on the website
  example: Insured for $1,000,000 with a named insurer
  strength: 0.6
- level: Vague claim on the website
  example: Fully insured
  strength: 0.35
- level: Nothing found
  example: 'Not scored: the factor''s weight moves to the others'
  strength: null
